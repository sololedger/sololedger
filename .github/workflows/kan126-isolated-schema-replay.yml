name: KAN-126 isolated SoloLedger schema replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-schema-replay:
    if: >-
      github.repository == 'sololedger/sololedger' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository_id == '1244768485'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out app repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Confirm local-only migration inputs
        shell: bash
        run: |
          set -euo pipefail
          count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          test "$count" -ge 76
          test -f supabase/migrations/20260925000000_pre_kan17_cli_baseline.sql
          echo "KAN126_MIGRATION_INPUTS_OK count=$count"
      - name: Initialize disposable local Supabase configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ''
          SUPABASE_DB_PASSWORD: ''
          DATABASE_URL: ''
          DIRECT_URL: ''
        run: |
          set -euo pipefail
          npx --yes supabase@2.119.0 init --force
          test -f supabase/config.toml
          echo 'KAN126_LOCAL_CONFIG_OK'
      - name: Replay real migrations into isolated Docker Supabase
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ''
          SUPABASE_DB_PASSWORD: ''
          DATABASE_URL: ''
          DIRECT_URL: ''
        run: |
          set -euo pipefail
          npx --yes supabase@2.119.0 start
          npx --yes supabase@2.119.0 db reset --local --yes
          echo 'KAN126_SOLOLEDGER_SCHEMA_REPLAY_PASS'
      - name: Verify restored SoloLedger schema, RLS and integrity contracts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1 || { echo 'KAN126_LOCAL_DB_NOT_UNIQUE'; exit 1; }
          db="${dbs[0]}"
          expected="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          actual="$(docker exec "$db" psql -X -q -t -A -v ON_ERROR_STOP=1 -U postgres -d postgres -c 'SELECT count(*) FROM supabase_migrations.schema_migrations' | tr -d '[:space:]')"
          test "$actual" = "$expected" || { echo 'KAN126_MIGRATION_LEDGER_MISMATCH'; exit 1; }
          docker exec -i "$db" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          DO $kan126$
          DECLARE
            rls_tables integer;
            policies integer;
            fks integer;
            triggers integer;
            functions integer;
          BEGIN
            IF to_regclass('public.profiles') IS NULL
               OR to_regclass('public.accounts') IS NULL THEN
              RAISE EXCEPTION 'KAN126_CORE_TABLES_MISSING';
            END IF;
            SELECT count(*) INTO rls_tables FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind IN ('r','p') AND c.relrowsecurity;
            SELECT count(*) INTO policies FROM pg_policies WHERE schemaname = 'public';
            SELECT count(*) INTO fks FROM pg_constraint c
              JOIN pg_namespace n ON n.oid = c.connamespace
              WHERE n.nspname = 'public' AND c.contype = 'f';
            SELECT count(*) INTO triggers FROM pg_trigger t
              JOIN pg_class c ON c.oid = t.tgrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND NOT t.tgisinternal AND t.tgenabled <> 'D';
            SELECT count(*) INTO functions FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public';
            IF rls_tables = 0 OR policies = 0 OR fks = 0 OR triggers = 0 OR functions = 0 THEN
              RAISE EXCEPTION 'KAN126_SCHEMA_SECURITY_OBJECTS_MISSING';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.profiles'::regclass AND contype = 'f') THEN
              RAISE EXCEPTION 'KAN126_PROFILE_FOREIGN_KEY_MISSING';
            END IF;
          END
          $kan126$;
          SQL
          echo "KAN126_REAL_SCHEMA_INTEGRITY_PASS migrations=$actual"
      - name: Seed two isolated synthetic bookkeeping tenants
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1
          docker exec -i "${dbs[0]}" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          INSERT INTO auth.users (id, instance_id, aud, role, email, encrypted_password, created_at, updated_at)
          VALUES
            ('11111111-1111-4111-8111-111111111111', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'kan126-a@example.invalid', '', now(), now()),
            ('22222222-2222-4222-8222-222222222222', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'kan126-b@example.invalid', '', now(), now());
          INSERT INTO public.accounts (id, user_id, name, debit_account, credit_account)
          VALUES
            ('KAN126-A', '11111111-1111-4111-8111-111111111111', 'Synthetic tenant A', '1930', '3001'),
            ('KAN126-B', '22222222-2222-4222-8222-222222222222', 'Synthetic tenant B', '1930', '3001');
          INSERT INTO public.transactions (id, user_id, date, description, amount, type)
          VALUES
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', '11111111-1111-4111-8111-111111111111', '2026-01-15', 'KAN126 synthetic A', 125.00, 'income'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', '22222222-2222-4222-8222-222222222222', '2026-01-16', 'KAN126 synthetic B', 250.00, 'income');
          SQL
          echo 'KAN126_TWO_TENANT_SEED_PASS'
      - name: Verify real local Supabase Storage API with synthetic private files
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ''
          SUPABASE_DB_PASSWORD: ''
          DATABASE_URL: ''
          DIRECT_URL: ''
        run: |
          set -euo pipefail
          npx --yes supabase@2.119.0 status -o env > "$RUNNER_TEMP/kan126-local-status.env"
          chmod 600 "$RUNNER_TEMP/kan126-local-status.env"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const lines = fs.readFileSync(process.env.RUNNER_TEMP + '/kan126-local-status.env', 'utf8');
          const vars = Object.fromEntries(lines.split(/\r?\n/).map(line => {
            const match = line.match(/^([A-Z_]+)=(.*)$/);
            if (!match) return [];
            let value = match[2].trim();
            if (value.startsWith('"') && value.endsWith('"')) value = value.slice(1,-1);
            return [match[1],value];
          }).filter(pair => pair.length === 2));
          const base = vars.API_URL;
          const key = vars.SERVICE_ROLE_KEY;
          if (!base?.startsWith('http://127.0.0.1:') && !base?.startsWith('http://localhost:')) throw Error('KAN126_LOCAL_API_URL_INVALID');
          if (!key) throw Error('KAN126_LOCAL_SERVICE_KEY_MISSING');
          const bucket='kan126-private-fixtures';
          const auth = {apikey:key,Authorization:'Bearer '+key};
          async function request(path,options={}) {
            const response=await fetch(base+path,{...options,headers:{...auth,...options.headers}});
            if (!response.ok) throw Error('KAN126_STORAGE_API_HTTP_'+response.status+' '+path);
            return response;
          }
          await request('/storage/v1/bucket',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:bucket,name:bucket,public:false})});
          for (const [tenant,name,body] of [['a','invoice.txt','KAN126 synthetic tenant A invoice'],['b','receipt.txt','KAN126 synthetic tenant B receipt']]) {
            const object=tenant+'/'+name;
            await request('/storage/v1/object/'+bucket+'/'+object,{method:'POST',headers:{'Content-Type':'text/plain'},body});
            const downloaded=await (await request('/storage/v1/object/authenticated/'+bucket+'/'+object)).text();
            if (crypto.createHash('sha256').update(downloaded).digest('hex') !== crypto.createHash('sha256').update(body).digest('hex')) throw Error('KAN126_STORAGE_API_CONTENT_MISMATCH');
            const anonymous=await fetch(base+'/storage/v1/object/public/'+bucket+'/'+object);
            if (anonymous.ok) throw Error('KAN126_PRIVATE_STORAGE_PUBLIC_READ_ALLOWED');
          }
          console.log('KAN126_LOCAL_STORAGE_API_PRIVATE_FILES_PASS files=2');
          JS
      - name: Verify authenticated synthetic users cannot read private Storage fixtures
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ''
          SUPABASE_DB_PASSWORD: ''
          DATABASE_URL: ''
          DIRECT_URL: ''
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const vars=Object.fromEntries(fs.readFileSync(process.env.RUNNER_TEMP+'/kan126-local-status.env','utf8').split(/\r?\n/).map(line=>{
            const m=line.match(/^([A-Z_]+)=(.*)$/);if(!m)return [];
            return [m[1],m[2].trim().replace(/^"|"$/g,'')];
          }).filter(x=>x.length===2));
          if(!/^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(vars.API_URL||'')||!vars.SERVICE_ROLE_KEY||!vars.ANON_KEY)throw Error('KAN126_LOCAL_AUTH_CONFIG_INVALID');
          const users=[];
          for(const tenant of ['a','b']){
            const email='kan126-storage-auth-'+tenant+'@example.invalid';
            const password=crypto.randomBytes(24).toString('hex');
            const create=await fetch(vars.API_URL+'/auth/v1/admin/users',{method:'POST',headers:{apikey:vars.SERVICE_ROLE_KEY,Authorization:'Bearer '+vars.SERVICE_ROLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,email_confirm:true})});
            if(!create.ok)throw Error('KAN126_LOCAL_AUTH_CREATE_FAILED_'+create.status);
            const login=await fetch(vars.API_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:vars.ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
            if(!login.ok)throw Error('KAN126_LOCAL_AUTH_LOGIN_FAILED_'+login.status);
            const token=(await login.json()).access_token;
            if(!token)throw Error('KAN126_LOCAL_AUTH_TOKEN_MISSING');
            users.push({tenant,token});
          }
          for(const user of users){
            for(const object of ['a/invoice.txt','b/receipt.txt']){
              const response=await fetch(vars.API_URL+'/storage/v1/object/authenticated/kan126-private-fixtures/'+object,{headers:{apikey:vars.ANON_KEY,Authorization:'Bearer '+user.token}});
              if(response.ok)throw Error('KAN126_STORAGE_UNEXPECTED_AUTH_READ tenant='+user.tenant+' object='+object);
            }
          }
          const tokenPath=process.env.RUNNER_TEMP+'/kan126-storage-user-tokens.json';
          fs.writeFileSync(tokenPath,JSON.stringify(users),{mode:0o600});
          fs.chmodSync(tokenPath,0o600);
          console.log('KAN126_STORAGE_AUTHENTICATED_DEFAULT_DENY_PASS users=2 objects=2');
          JS
      - name: Capture and validate custom-format backup of real local SoloLedger schema
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1 || { echo 'KAN126_LOCAL_DB_NOT_UNIQUE'; exit 1; }
          db="${dbs[0]}"
          dump="$(mktemp)"
          toc="$(mktemp)"
          trap 'rm -f "$dump" "$toc"' EXIT
          docker exec "$db" pg_dump -U postgres -d postgres -Fc > "$dump"
          test -s "$dump" || { echo 'KAN126_LOCAL_DUMP_EMPTY'; exit 1; }
          docker cp "$dump" "$db:/tmp/kan126-local-schema.dump"
          docker exec "$db" pg_restore --list /tmp/kan126-local-schema.dump > "$toc"
          grep -q 'TABLE public profiles' "$toc" || { echo 'KAN126_LOCAL_DUMP_PROFILES_MISSING'; exit 1; }
          grep -q 'TABLE public accounts' "$toc" || { echo 'KAN126_LOCAL_DUMP_ACCOUNTS_MISSING'; exit 1; }
          grep -q 'POLICY public' "$toc" || { echo 'KAN126_LOCAL_DUMP_POLICIES_MISSING'; exit 1; }
          grep -q 'TRIGGER public' "$toc" || { echo 'KAN126_LOCAL_DUMP_TRIGGERS_MISSING'; exit 1; }
          grep -q 'FK CONSTRAINT public' "$toc" || { echo 'KAN126_LOCAL_DUMP_FKS_MISSING'; exit 1; }
          sha256sum "$dump" | cut -d' ' -f1 | grep -Eq '^[a-f0-9]{64}$'
          echo 'KAN126_REAL_SCHEMA_CUSTOM_DUMP_PASS'
      - name: Verify age encryption and decryption of synthetic SoloLedger database backup
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          command -v age
          command -v age-keygen
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1 || { echo 'KAN126_LOCAL_DB_NOT_UNIQUE'; exit 1; }
          db="${dbs[0]}"
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          chmod 700 "$temp"
          docker cp "$db:/tmp/kan126-local-schema.dump" "$temp/source.dump"
          age-keygen -o "$temp/identity.txt" 2>"$temp/keygen.log"
          chmod 600 "$temp/identity.txt"
          recipient="$(age-keygen -y "$temp/identity.txt")"
          age -r "$recipient" -o "$temp/backup.dump.age" "$temp/source.dump"
          test -s "$temp/backup.dump.age"
          if cmp -s "$temp/source.dump" "$temp/backup.dump.age"; then
            echo 'KAN126_AGE_CIPHERTEXT_EQUALS_PLAINTEXT'
            exit 1
          fi
          age -d -i "$temp/identity.txt" -o "$temp/decrypted.dump" "$temp/backup.dump.age"
          cmp -s "$temp/source.dump" "$temp/decrypted.dump" || { echo 'KAN126_AGE_DECRYPT_MISMATCH'; exit 1; }
          cp "$temp/backup.dump.age" "$temp/tampered.dump.age"
          printf '\\000' | dd of="$temp/tampered.dump.age" bs=1 seek=64 count=1 conv=notrunc status=none
          if age -d -i "$temp/identity.txt" -o "$temp/tampered-output.dump" "$temp/tampered.dump.age" >/dev/null 2>&1; then
            echo 'KAN126_AGE_TAMPER_NOT_REJECTED'
            exit 1
          fi
          docker cp "$temp/decrypted.dump" "$db:/tmp/kan126-local-schema.dump"
          echo 'KAN126_REAL_SCHEMA_AGE_ROUNDTRIP_PASS'
      - name: Encrypt and restore two-tenant synthetic Storage file bundle
        shell: bash
        run: |
          set -euo pipefail
          command -v age
          command -v age-keygen
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          chmod 700 "$temp"
          mkdir -p "$temp/source/tenant-a" "$temp/source/tenant-b" "$temp/recovered"
          printf 'KAN126 tenant A synthetic invoice attachment\\n' > "$temp/source/tenant-a/invoice.txt"
          printf 'KAN126 tenant B synthetic receipt attachment\\n' > "$temp/source/tenant-b/receipt.txt"
          (cd "$temp/source" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$temp/manifest.sha256"
          tar -C "$temp/source" -cf "$temp/storage.tar" tenant-a tenant-b
          age-keygen -o "$temp/identity.txt" 2>/dev/null
          chmod 600 "$temp/identity.txt"
          recipient="$(age-keygen -y "$temp/identity.txt")"
          age -r "$recipient" -o "$temp/storage.tar.age" "$temp/storage.tar"
          test -s "$temp/storage.tar.age"
          if cmp -s "$temp/storage.tar" "$temp/storage.tar.age"; then
            echo 'KAN126_STORAGE_CIPHERTEXT_EQUALS_PLAINTEXT'
            exit 1
          fi
          age -d -i "$temp/identity.txt" -o "$temp/recovered.tar" "$temp/storage.tar.age"
          tar -C "$temp/recovered" -xf "$temp/recovered.tar"
          (cd "$temp/recovered" && sha256sum -c "$temp/manifest.sha256" --status) || {
            echo 'KAN126_STORAGE_HASH_MISMATCH'
            exit 1
          }
          test "$(find "$temp/recovered" -type f | wc -l)" -eq 2
          cp "$temp/storage.tar.age" "$temp/tampered.age"
          printf '\\000' | dd of="$temp/tampered.age" bs=1 seek=90 count=1 conv=notrunc status=none
          if age -d -i "$temp/identity.txt" -o "$temp/tampered.tar" "$temp/tampered.age" >/dev/null 2>&1; then
            echo 'KAN126_STORAGE_TAMPER_NOT_REJECTED'
            exit 1
          fi
          echo 'KAN126_SYNTHETIC_STORAGE_ENCRYPTED_RESTORE_PASS files=2'
      - name: Restore real local backup into separate disposable database
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1 || { echo 'KAN126_LOCAL_DB_NOT_UNIQUE'; exit 1; }
          db="${dbs[0]}"
          docker exec "$db" createdb -U postgres -T template0 kan126_restore
          # The local Supabase postgres role is not a superuser. Internal Realtime
          # functions in a full cluster dump require supabase_admin on restore.
          test "$(docker exec "$db" psql -X -t -A -U postgres -d postgres -c "SELECT rolsuper FROM pg_roles WHERE rolname='supabase_admin'")" = "t" || { echo 'KAN126_LOCAL_SUPABASE_ADMIN_NOT_SUPERUSER'; exit 1; }
          # Preserve SQL GRANT/REVOKE ACL entries so authenticated access behaves as in the source.
          # Roles are already present in the disposable local Supabase cluster.
          docker exec "$db" pg_restore -U supabase_admin -d kan126_restore --exit-on-error --no-owner /tmp/kan126-local-schema.dump
          docker exec -i "$db" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d kan126_restore <<'SQL'
          DO $kan126$
          BEGIN
            IF to_regclass('public.profiles') IS NULL OR to_regclass('public.accounts') IS NULL THEN
              RAISE EXCEPTION 'KAN126_RESTORE_CORE_TABLES_MISSING';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relname='profiles' AND c.relrowsecurity) THEN
              RAISE EXCEPTION 'KAN126_RESTORE_RLS_MISSING';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public') THEN
              RAISE EXCEPTION 'KAN126_RESTORE_POLICIES_MISSING';
            END IF;
          END
          $kan126$;
          SQL
          echo 'KAN126_REAL_SCHEMA_RESTORE_PASS'
      - name: Verify restored Storage metadata matches API-uploaded objects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1 || { echo 'KAN126_LOCAL_DB_NOT_UNIQUE'; exit 1; }
          db="${dbs[0]}"
          for database in postgres kan126_restore; do
            result="$(docker exec "$db" psql -X -q -t -A -v ON_ERROR_STOP=1 -U postgres -d "$database" -c "
              SELECT string_agg(name, ',' ORDER BY name)
              FROM storage.objects
              WHERE bucket_id='kan126-private-fixtures'
            " | tr -d '[:space:]')"
            test "$result" = 'a/invoice.txt,b/receipt.txt' || {
              echo "KAN126_STORAGE_METADATA_MISMATCH db=$database"
              exit 1
            }
            private="$(docker exec "$db" psql -X -q -t -A -v ON_ERROR_STOP=1 -U postgres -d "$database" -c "
              SELECT public FROM storage.buckets WHERE id='kan126-private-fixtures'
            " | tr -d '[:space:]')"
            test "$private" = 'f' || {
              echo "KAN126_STORAGE_BUCKET_NOT_PRIVATE db=$database"
              exit 1
            }
            echo "KAN126_STORAGE_METADATA_PARITY_OK db=$database objects=2"
          done
          echo 'KAN126_STORAGE_METADATA_RESTORE_PASS'
      - name: Restore actual Storage API file bytes from encrypted synthetic backup into separate private bucket
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ''
          SUPABASE_DB_PASSWORD: ''
          DATABASE_URL: ''
          DIRECT_URL: ''
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          chmod 700 "$tmp"
          mkdir -p "$tmp/source/a" "$tmp/source/b" "$tmp/restored"
          export KAN126_STORAGE_TMP="$tmp"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const vars=Object.fromEntries(fs.readFileSync(process.env.RUNNER_TEMP+'/kan126-local-status.env','utf8').split(/\r?\n/).map(line=>{
            const m=line.match(/^([A-Z_]+)=(.*)$/);if(!m)return [];
            return [m[1],m[2].trim().replace(/^"|"$/g,'')];
          }).filter(x=>x.length===2));
          if(!/^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(vars.API_URL||'')||!vars.SERVICE_ROLE_KEY)throw Error('KAN126_LOCAL_API_INVALID');
          const headers={apikey:vars.SERVICE_ROLE_KEY,Authorization:'Bearer '+vars.SERVICE_ROLE_KEY};
          const root=process.env.KAN126_STORAGE_TMP;
          const manifest={};
          for(const object of ['a/invoice.txt','b/receipt.txt']){
            const r=await fetch(vars.API_URL+'/storage/v1/object/authenticated/kan126-private-fixtures/'+object,{headers});
            if(!r.ok)throw Error('KAN126_STORAGE_SOURCE_DOWNLOAD_FAILED');
            const bytes=Buffer.from(await r.arrayBuffer());
            if(!bytes.length)throw Error('KAN126_STORAGE_SOURCE_EMPTY');
            fs.writeFileSync(path.join(root,'source',object),bytes);
            manifest[object]=crypto.createHash('sha256').update(bytes).digest('hex');
          }
          fs.writeFileSync(path.join(root,'manifest.json'),JSON.stringify(manifest));
          console.log('KAN126_STORAGE_API_BYTES_EXPORTED files=2');
          JS
          tar -C "$tmp/source" -cf "$tmp/objects.tar" a b
          age-keygen -o "$tmp/key.txt" 2>/dev/null
          chmod 600 "$tmp/key.txt"
          recipient="$(age-keygen -y "$tmp/key.txt")"
          age -r "$recipient" -o "$tmp/objects.tar.age" "$tmp/objects.tar"
          age -d -i "$tmp/key.txt" -o "$tmp/recovered.tar" "$tmp/objects.tar.age"
          tar -C "$tmp/restored" -xf "$tmp/recovered.tar"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root=process.env.KAN126_STORAGE_TMP;
          const vars=Object.fromEntries(fs.readFileSync(process.env.RUNNER_TEMP+'/kan126-local-status.env','utf8').split(/\r?\n/).map(line=>{
            const m=line.match(/^([A-Z_]+)=(.*)$/);if(!m)return [];
            return [m[1],m[2].trim().replace(/^"|"$/g,'')];
          }).filter(x=>x.length===2));
          if(!/^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(vars.API_URL||'')||!vars.SERVICE_ROLE_KEY)throw Error('KAN126_LOCAL_API_INVALID');
          const headers={apikey:vars.SERVICE_ROLE_KEY,Authorization:'Bearer '+vars.SERVICE_ROLE_KEY};
          const bucket='kan126-private-restored';
          const create=await fetch(vars.API_URL+'/storage/v1/bucket',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({id:bucket,name:bucket,public:false})});
          if(!create.ok)throw Error('KAN126_RESTORED_BUCKET_CREATE_FAILED');
          const manifest=JSON.parse(fs.readFileSync(path.join(root,'manifest.json'),'utf8'));
          for(const [object,expected] of Object.entries(manifest)){
            const bytes=fs.readFileSync(path.join(root,'restored',object));
            if(crypto.createHash('sha256').update(bytes).digest('hex')!==expected)throw Error('KAN126_DECRYPTED_STORAGE_HASH_MISMATCH');
            const upload=await fetch(vars.API_URL+'/storage/v1/object/'+bucket+'/'+object,{method:'POST',headers:{...headers,'Content-Type':'application/octet-stream'},body:bytes});
            if(!upload.ok)throw Error('KAN126_RESTORED_STORAGE_UPLOAD_FAILED');
            const download=await fetch(vars.API_URL+'/storage/v1/object/authenticated/'+bucket+'/'+object,{headers});
            if(!download.ok)throw Error('KAN126_RESTORED_STORAGE_DOWNLOAD_FAILED');
            const recovered=Buffer.from(await download.arrayBuffer());
            if(crypto.createHash('sha256').update(recovered).digest('hex')!==expected)throw Error('KAN126_RESTORED_STORAGE_HASH_MISMATCH');
            const publicRead=await fetch(vars.API_URL+'/storage/v1/object/public/'+bucket+'/'+object);
            if(publicRead.ok)throw Error('KAN126_RESTORED_STORAGE_PUBLIC_ACCESS');
          }
          const anonKey=vars.ANON_KEY;
          if(!anonKey)throw Error('KAN126_LOCAL_ANON_KEY_MISSING');
          for(const object of Object.keys(manifest)){
            for(const target of ['kan126-private-fixtures',bucket]){
              const url=vars.API_URL+'/storage/v1/object/authenticated/'+target+'/'+object;
              const anon=await fetch(url,{headers:{apikey:anonKey,Authorization:'Bearer '+anonKey}});
              if(anon.ok)throw Error('KAN126_STORAGE_ANON_READ_ALLOWED');
              const unauthenticated=await fetch(url);
              if(unauthenticated.ok)throw Error('KAN126_STORAGE_UNAUTHENTICATED_READ_ALLOWED');
            }
          }
          console.log('KAN126_STORAGE_ANON_DENIAL_PASS objects=2 buckets=2');
          console.log('KAN126_STORAGE_API_ENCRYPTED_BYTES_RESTORED_PASS files=2');
          JS
      - name: Verify own-file access and cross-tenant denial under isolated Storage policy
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ''
          SUPABASE_DB_PASSWORD: ''
          DATABASE_URL: ''
          DIRECT_URL: ''
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1
          docker exec -i "${dbs[0]}" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          CREATE POLICY kan126_local_fixture_read ON storage.objects
          FOR SELECT TO authenticated
          USING (
            bucket_id IN ('kan126-private-fixtures','kan126-private-restored')
            AND (
              (name LIKE 'a/%' AND auth.jwt()->>'email' = 'kan126-storage-auth-a@example.invalid')
              OR
              (name LIKE 'b/%' AND auth.jwt()->>'email' = 'kan126-storage-auth-b@example.invalid')
            )
          );
          SQL
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const vars=Object.fromEntries(fs.readFileSync(process.env.RUNNER_TEMP+'/kan126-local-status.env','utf8').split(/\r?\n/).map(line=>{
            const m=line.match(/^([A-Z_]+)=(.*)$/);if(!m)return [];
            return [m[1],m[2].trim().replace(/^"|"$/g,'')];
          }).filter(x=>x.length===2));
          if(!/^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(vars.API_URL||'')||!vars.ANON_KEY)throw Error('KAN126_LOCAL_STORAGE_AUTH_CONFIG_INVALID');
          const users=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/kan126-storage-user-tokens.json','utf8'));
          if(users.length!==2)throw Error('KAN126_LOCAL_STORAGE_USERS_MISSING');
          const expected={'a/invoice.txt':'KAN126 synthetic tenant A invoice','b/receipt.txt':'KAN126 synthetic tenant B receipt'};
          for(const bucket of ['kan126-private-fixtures','kan126-private-restored']){
            for(const user of users){
              for(const [object,body] of Object.entries(expected)){
                const response=await fetch(vars.API_URL+'/storage/v1/object/authenticated/'+bucket+'/'+object,{headers:{apikey:vars.ANON_KEY,Authorization:'Bearer '+user.token}});
                if(object.startsWith(user.tenant+'/')){
                  if(!response.ok)throw Error('KAN126_STORAGE_OWN_READ_DENIED tenant='+user.tenant+' bucket='+bucket+' status='+response.status);
                  const actual=Buffer.from(await response.arrayBuffer());
                  if(crypto.createHash('sha256').update(actual).digest('hex')!==crypto.createHash('sha256').update(body).digest('hex'))throw Error('KAN126_STORAGE_OWN_READ_HASH_MISMATCH');
                }else if(response.ok){
                  throw Error('KAN126_STORAGE_CROSS_TENANT_READ_ALLOWED tenant='+user.tenant+' bucket='+bucket);
                }
              }
            }
          }
          console.log('KAN126_STORAGE_AUTHENTICATED_TENANT_ISOLATION_PASS users=2 buckets=2');
          JS
      - name: Compare original and restored schema security objects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1 || { echo 'KAN126_LOCAL_DB_NOT_UNIQUE'; exit 1; }
          db="${dbs[0]}"
          for metric in public_tables public_rls_tables public_policies public_foreign_keys public_triggers public_functions; do
            case "$metric" in
              public_tables) sql="SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p')" ;;
              public_rls_tables) sql="SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p') AND c.relrowsecurity" ;;
              public_policies) sql="SELECT count(*) FROM pg_policies WHERE schemaname='public'" ;;
              public_foreign_keys) sql="SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid=c.connamespace WHERE n.nspname='public' AND c.contype='f'" ;;
              public_triggers) sql="SELECT count(*) FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND NOT t.tgisinternal AND t.tgenabled <> 'D'" ;;
              public_functions) sql="SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public'" ;;
            esac
            source_count="$(docker exec "$db" psql -X -q -t -A -v ON_ERROR_STOP=1 -U postgres -d postgres -c "$sql" | tr -d '[:space:]')"
            restored_count="$(docker exec "$db" psql -X -q -t -A -v ON_ERROR_STOP=1 -U postgres -d kan126_restore -c "$sql" | tr -d '[:space:]')"
            if [[ "$source_count" != "$restored_count" ]]; then
              echo "KAN126_RESTORE_PARITY_FAIL metric=$metric source=$source_count restored=$restored_count"
              exit 1
            fi
            echo "KAN126_RESTORE_PARITY_OK metric=$metric count=$restored_count"
          done
          echo 'KAN126_REAL_SCHEMA_RESTORE_PARITY_PASS'
      - name: Verify synthetic bookkeeping recovery and tenant RLS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1
          db="${dbs[0]}"
          for database in postgres kan126_restore; do
            for tenant in a b; do
              if [[ "$tenant" == a ]]; then
                uid='11111111-1111-4111-8111-111111111111'
                expected='125.00'
              else
                uid='22222222-2222-4222-8222-222222222222'
                expected='250.00'
              fi
              result="$(docker exec -i "$db" psql -X -q -t -A -v ON_ERROR_STOP=1 -U postgres -d "$database" <<SQL
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '$uid', true);
          SELECT (SELECT count(*) FROM public.accounts)::text || ':' ||
                 (SELECT count(*) FROM public.transactions)::text || ':' ||
                 (SELECT amount::text FROM public.transactions LIMIT 1);
          ROLLBACK;
          SQL
          )"
              result="$(printf '%s\n' "$result" | tail -n 1)"
              test "$result" = "1:1:$expected" || { echo "KAN126_TENANT_RLS_FAIL db=$database tenant=$tenant"; exit 1; }
              echo "KAN126_TENANT_RLS_OK db=$database tenant=$tenant"
            done
          done
          echo 'KAN126_SYNTHETIC_BOOKKEEPING_RESTORE_RLS_PASS'
      - name: Stop disposable Supabase services
        if: always()
        shell: bash
        run: npx --yes supabase@2.119.0 stop --no-backup || true
