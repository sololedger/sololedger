name: KAN-126 isolated SoloLedger schema replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-schema-replay:
    if: >-
      github.repository == 'sololedger/sololedger' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository_id == '1244768485'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out app repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Confirm local-only migration inputs
        shell: bash
        run: |
          set -euo pipefail
          count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          test "$count" -ge 76
          test -f supabase/migrations/20260925000000_pre_kan17_cli_baseline.sql
          echo "KAN126_MIGRATION_INPUTS_OK count=$count"
      - name: Initialize disposable local Supabase configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ''
          SUPABASE_DB_PASSWORD: ''
          DATABASE_URL: ''
          DIRECT_URL: ''
        run: |
          set -euo pipefail
          npx --yes supabase@2.119.0 init --force
          test -f supabase/config.toml
          echo 'KAN126_LOCAL_CONFIG_OK'
      - name: Replay real migrations into isolated Docker Supabase
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ''
          SUPABASE_DB_PASSWORD: ''
          DATABASE_URL: ''
          DIRECT_URL: ''
        run: |
          set -euo pipefail
          npx --yes supabase@2.119.0 start
          npx --yes supabase@2.119.0 db reset --local --yes
          echo 'KAN126_SOLOLEDGER_SCHEMA_REPLAY_PASS'
      - name: Verify restored SoloLedger schema, RLS and integrity contracts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1 || { echo 'KAN126_LOCAL_DB_NOT_UNIQUE'; exit 1; }
          db="${dbs[0]}"
          expected="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          actual="$(docker exec "$db" psql -X -q -t -A -v ON_ERROR_STOP=1 -U postgres -d postgres -c 'SELECT count(*) FROM supabase_migrations.schema_migrations' | tr -d '[:space:]')"
          test "$actual" = "$expected" || { echo 'KAN126_MIGRATION_LEDGER_MISMATCH'; exit 1; }
          docker exec -i "$db" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          DO $kan126$
          DECLARE
            rls_tables integer;
            policies integer;
            fks integer;
            triggers integer;
            functions integer;
          BEGIN
            IF to_regclass('public.profiles') IS NULL
               OR to_regclass('public.accounts') IS NULL THEN
              RAISE EXCEPTION 'KAN126_CORE_TABLES_MISSING';
            END IF;
            SELECT count(*) INTO rls_tables FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind IN ('r','p') AND c.relrowsecurity;
            SELECT count(*) INTO policies FROM pg_policies WHERE schemaname = 'public';
            SELECT count(*) INTO fks FROM pg_constraint c
              JOIN pg_namespace n ON n.oid = c.connamespace
              WHERE n.nspname = 'public' AND c.contype = 'f';
            SELECT count(*) INTO triggers FROM pg_trigger t
              JOIN pg_class c ON c.oid = t.tgrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND NOT t.tgisinternal AND t.tgenabled <> 'D';
            SELECT count(*) INTO functions FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public';
            IF rls_tables = 0 OR policies = 0 OR fks = 0 OR triggers = 0 OR functions = 0 THEN
              RAISE EXCEPTION 'KAN126_SCHEMA_SECURITY_OBJECTS_MISSING';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.profiles'::regclass AND contype = 'f') THEN
              RAISE EXCEPTION 'KAN126_PROFILE_FOREIGN_KEY_MISSING';
            END IF;
          END
          $kan126$;
          SQL
          echo "KAN126_REAL_SCHEMA_INTEGRITY_PASS migrations=$actual"
      - name: Capture and validate custom-format backup of real local SoloLedger schema
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1 || { echo 'KAN126_LOCAL_DB_NOT_UNIQUE'; exit 1; }
          db="${dbs[0]}"
          dump="$(mktemp)"
          toc="$(mktemp)"
          trap 'rm -f "$dump" "$toc"' EXIT
          docker exec "$db" pg_dump -U postgres -d postgres -Fc > "$dump"
          test -s "$dump" || { echo 'KAN126_LOCAL_DUMP_EMPTY'; exit 1; }
          docker cp "$dump" "$db:/tmp/kan126-local-schema.dump"
          docker exec "$db" pg_restore --list /tmp/kan126-local-schema.dump > "$toc"
          grep -q 'TABLE public profiles' "$toc" || { echo 'KAN126_LOCAL_DUMP_PROFILES_MISSING'; exit 1; }
          grep -q 'TABLE public accounts' "$toc" || { echo 'KAN126_LOCAL_DUMP_ACCOUNTS_MISSING'; exit 1; }
          grep -q 'POLICY public' "$toc" || { echo 'KAN126_LOCAL_DUMP_POLICIES_MISSING'; exit 1; }
          grep -q 'TRIGGER public' "$toc" || { echo 'KAN126_LOCAL_DUMP_TRIGGERS_MISSING'; exit 1; }
          grep -q 'FK CONSTRAINT public' "$toc" || { echo 'KAN126_LOCAL_DUMP_FKS_MISSING'; exit 1; }
          sha256sum "$dump" | cut -d' ' -f1 | grep -Eq '^[a-f0-9]{64}$'
          echo 'KAN126_REAL_SCHEMA_CUSTOM_DUMP_PASS'
      - name: Restore real local backup into separate disposable database
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --filter 'name=^/supabase_db_' --format '{{.ID}}')
          test "${#dbs[@]}" -eq 1 || { echo 'KAN126_LOCAL_DB_NOT_UNIQUE'; exit 1; }
          db="${dbs[0]}"
          docker exec "$db" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres -c "SELECT 1 FROM pg_database WHERE datname = 'kan126_restore'" | grep -q 1 && { echo 'KAN126_RESTORE_DB_ALREADY_EXISTS'; exit 1; } || true
          docker exec "$db" createdb -U postgres -T template0 kan126_restore
          docker exec "$db" pg_restore -U postgres -d kan126_restore --exit-on-error --no-owner --no-acl /tmp/kan126-local-schema.dump
          docker exec -i "$db" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d kan126_restore <<'SQL'
          DO $kan126$
          BEGIN
            IF to_regclass('public.profiles') IS NULL OR to_regclass('public.accounts') IS NULL THEN
              RAISE EXCEPTION 'KAN126_RESTORE_CORE_TABLES_MISSING';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relname='profiles' AND c.relrowsecurity) THEN
              RAISE EXCEPTION 'KAN126_RESTORE_RLS_MISSING';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public') THEN
              RAISE EXCEPTION 'KAN126_RESTORE_POLICIES_MISSING';
            END IF;
          END
          $kan126$;
          SQL
          echo 'KAN126_REAL_SCHEMA_RESTORE_PASS'
      - name: Stop disposable Supabase services
        if: always()
        shell: bash
        run: npx --yes supabase@2.119.0 stop --no-backup || true
